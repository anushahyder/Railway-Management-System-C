name: Compile C Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Compile C Files
      run: |
        cd Source_Code
        gcc main.c final_train01.c staff_management.c -o RailwaySystem
